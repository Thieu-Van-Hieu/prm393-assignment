name: my_fschool_frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # GO ROUTER
  go_router: ^17.2.3
  
  # HTTP
  dio: ^5.9.2
  
  # MAPPABLE
  dart_mappable: ^4.6.0

  # HOOKS
  flutter_hooks: ^0.21.3+1
  
