name: my_fschool_frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # GO ROUTER
  go_router: ^17.2.3
  
  # HTTP
  dio: ^5.9.2
  
  # MAPPABLE
  dart_mappable: ^4.6.0
  
  # SECURE STORAGE
  flutter_secure_storage: ^10.3.1
  
  # DOTENV
  flutter_dotenv: ^6.0.1
  
  # RIVERPOD & HOOKS
  riverpod_annotation: ^4.0.0
  flutter_riverpod: ^3.2.0 # nâng từ 2.6.1
  hooks_riverpod: ^3.2.0
  flutter_hooks: ^0.21.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # BUILD RUNNER
  build_runner: ^2.4.13

  # MAPPABLE
  dart_mappable_builder: ^4.6.0
  
  # RIVERPOD
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fpt_logo.png
    - assets/logo.png
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo.png"
  min_sdk_android: 21